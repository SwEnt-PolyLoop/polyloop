# Edited with Claude.

name: CI - Test Runner

# Run the workflow when commits are pushed on main or when a PR is modified
on:
  push:
    branches: [ main, master ]

  pull_request:
    branches: [ main, master ]
    types:
      - opened
      - synchronize
      - reopened

jobs:
  # Type-check, build and test the Cloud Functions (functions/), separately from the Android app.
  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build

      # Java and the Firebase CLI, for the Firestore emulator that some tests read and write.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15

      - name: Firebase emulators cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15-firestore

      - name: Run tests
        run: firebase emulators:exec --only firestore "npm test"

  # Everything Android that needs no emulator: formatting, the debug and release builds, lint and
  # the unit tests. Runs at the same time as the instrumented tests.
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Decode secrets
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" | base64 --decode > ./app/google-services.json
          else
            echo "::error::GOOGLE_SERVICES secret is not set. google-services.json will not be created."
            exit 1
          fi

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      # A workflow runs in a clean environment every time, so the Gradle folder is cached to avoid
      # downloading and processing the Gradle files again on every run.
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew

      - name: KTFmt Check
        run: |
          ./gradlew ktfmtCheck

      - name: Assemble
        run: |
          # To run the CI with debug information, add --info
          ./gradlew assemble lint --parallel --build-cache

      - name: Run tests
        run: |
          # To run the CI with debug information, add --info
          ./gradlew check --parallel --build-cache

      # What the CI job needs for the coverage report and Sonar: the unit tests' coverage and
      # results, the lint report, and the compiled classes the coverage is matched against.
      - name: Upload results for Sonar
        uses: actions/upload-artifact@v7
        with:
          name: checks-results
          path: |
            app/build/outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.xml
            app/build/intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes/
          if-no-files-found: error
          retention-days: 1

  # The instrumented tests, on an Android emulator with the Firebase emulators running. They are
  # split in 2 shards, each on its own runner and emulator, so each runs half of them at the same
  # time.
  instrumented:
    name: Instrumented tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [ 0, 1 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Decode secrets
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" | base64 --decode > ./app/google-services.json
          else
            echo "::error::GOOGLE_SERVICES secret is not set. google-services.json will not be created."
            exit 1
          fi

      # Kernel-based Virtual Machine (KVM) is an open source virtualization technology built into Linux. Enabling it allows the Android emulator to run faster.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # Cache the Emulator, if the cache does not hit, create the emulator.
      # API 34 matches targetSdk. compileSdk 37 is only the compile platform.
      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34

      - name: create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # Firebase CLI, to run the Auth, Firestore and Storage emulators during the connected tests.
      # Node and npm are already installed on the GitHub runner.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15

      # Cache the emulator downloads so they are not fetched on every run.
      - name: Firebase emulators cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15-storage

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew

      # Run connected tests on the emulator, with the Firebase emulators running (see firebase.json)
      - name: run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: firebase emulators:exec --only auth,firestore,storage "./gradlew connectedCheck --parallel --build-cache -Pandroid.testInstrumentationRunnerArguments.numShards=2 -Pandroid.testInstrumentationRunnerArguments.shardIndex=${{ matrix.shard }}"

      # Only the coverage file is uploaded, so the CI job finds it at
      # connected/<artifact name>/coverage.ec, where jacocoTestReport looks.
      - name: Upload coverage for Sonar
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: app/build/outputs/code_coverage/debugAndroidTest/connected/*/coverage.ec
          if-no-files-found: error
          retention-days: 1

  # The coverage report of both test jobs, uploaded to SonarCloud. It is named CI because main
  # requires a check with that name. A job whose needs failed is skipped, and GitHub counts a
  # skipped required check as passed, so this job runs anyway and fails itself instead.
  ci:
    name: CI
    needs: [ checks, instrumented ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Fail if the checks or the instrumented tests did not pass
        if: needs.checks.result != 'success' || needs.instrumented.result != 'success'
        run: |
          echo "::error::Checks: ${{ needs.checks.result }}, instrumented tests: ${{ needs.instrumented.result }}."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of Sonar analysis

      - name: Decode secrets
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" | base64 --decode > ./app/google-services.json
          else
            echo "::error::GOOGLE_SERVICES secret is not set. google-services.json will not be created."
            exit 1
          fi

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Download the checks' results
        uses: actions/download-artifact@v8
        with:
          name: checks-results
          path: app/build

      # Each coverage-* artifact goes in its own folder, connected/<artifact name>/coverage.ec.
      - name: Download the instrumented tests' coverage
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: app/build/outputs/code_coverage/debugAndroidTest/connected

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew

      # This step generates the coverage report which will be uploaded to sonar
      - name: Generate Coverage Report
        run: |
          ./gradlew jacocoTestReport

      # Upload the various reports to sonar
      - name: Upload report to SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --parallel --build-cache
